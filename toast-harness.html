<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="light" />
<title>CCTrans toast harness — version compare</title>
<!-- Links the CURRENT (shipping) toast CSS. Also defines the :root tokens the current case reads. -->
<link rel="stylesheet" href="./src/app.css" />
<style>
  /* ───────────────────────────────────────────────────────────────────────────
     HARNESS-ONLY. NEVER ship. Renders the toast across THREE CSS versions so the
     fdcb42c regression is visible side-by-side:
       • CURRENT      = shipping src/app.css (the fix)            — document scope
       • PRE-fdcb42c  = git fdcb42c^ (just before delineation cut) — Shadow DOM
       • PRE-0627812  = git 0627812^ (CSS-card era, the #8 look)   — Shadow DOM
     Shadow DOM isolates each old stylesheet so the three .translation-bubble
     rule-sets don't collide, while still sharing ONE document so backdrop-filter
     blurs the same cream/red desktop behind every card (an <iframe> would not).
     The native NSVisualEffectView blur isn't browser-renderable, so .sim-window
     fakes it; PRE-0627812 instead keeps its own CSS backdrop-filter (that era's
     real blur source) and gets no sim blur. Native flicker is NOT testable here.
     ─────────────────────────────────────────────────────────────────────────── */
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }

  /* Sample desktop echoing #8: cream code editor (high-frequency lines so the blur
     frosting shows) over red, seam at 52% so the cards straddle it and red bleeds
     through translucent lower halves as pink — exactly like #8. */
  .desktop {
    position: relative;
    min-height: 100vh;
    background: linear-gradient(to bottom, #f6f3ec 0%, #f1ede3 52%, #d3493b 52%, #c43d2d 100%);
    overflow: hidden;
  }
  .desktop::before {
    content: "";
    position: absolute;
    inset: 0 0 48% 0;
    background:
      repeating-linear-gradient(to bottom, transparent 0 18px, rgba(40,52,74,.16) 18px 21px),
      repeating-linear-gradient(to right, transparent 0 60px, rgba(180,90,40,.10) 60px 96px, transparent 96px 150px, rgba(60,120,80,.10) 150px 210px);
    background-size: 100% 39px, 280px 100%;
  }

  .row { position: relative; display: flex; gap: 44px; align-items: flex-start; padding: 150px 52px 90px; }
  .case { display: flex; flex-direction: column; gap: 9px; align-items: flex-start; width: 396px; }
  .case .label { font: 600 12px/1.3 ui-monospace, "SF Mono", monospace; color: #fff; background: rgba(0,0,0,.62); padding: 4px 9px; border-radius: 5px; }
  .case .sub { font: 11px/1.3 ui-monospace, monospace; color: #fff; background: rgba(0,0,0,.42); padding: 2px 8px; border-radius: 4px; }

  /* The native toast WINDOW (396px, rounded 14). .sim-window fakes the vibrancy blur. */
  .sim-window {
    position: relative;
    width: 396px;
    border-radius: 14px;
    overflow: visible; /* the pin must be allowed to overhang the card edge */
    -webkit-backdrop-filter: blur(28px) saturate(1.6);
    backdrop-filter: blur(28px) saturate(1.6);
    box-shadow: 0 12px 38px rgba(0,0,0,.22);
  }
  /* PRE-0627812 had NO native window material — the bubble's own CSS backdrop-filter
     was the blur, and the window was transparent. So this case gets no sim blur. */
  .sim-window.no-native-blur { -webkit-backdrop-filter: none; backdrop-filter: none; box-shadow: none; border-radius: 0; }
  .sim-window .translation-stage, .sim-window .mount, .sim-window .host { height: auto; }

  /* CURRENT now uses an INSET card (src/app.css), and the real app will mask the native NSVisualEffectView
     to the bubble frame. Sim that masked material with a card-level blur (NOT full-window), so the gutter
     stays transparent like the planned result — full-window blur here would fake the fdcb42c double border. */
  #cur .translation-bubble { -webkit-backdrop-filter: blur(18px) saturate(1.2); backdrop-filter: blur(18px) saturate(1.2); box-shadow: 0 12px 38px rgba(0,0,0,.22); }
</style>
</head>
<body>
<div class="desktop">
  <div class="row">
    <div class="case">
      <span class="label">CURRENT — src/app.css (inset card)</span>
      <span class="sub" id="sub-cur">measuring…</span>
      <div class="sim-window no-native-blur"><div class="mount" id="cur"></div></div>
    </div>
    <div class="case">
      <span class="label">PRE-fdcb42c (fdcb42c^)</span>
      <span class="sub" id="sub-pre-fdcb42c">measuring…</span>
      <div class="sim-window"><div class="host" id="pre-fdcb42c" data-surface="translation"></div></div>
    </div>
    <div class="case">
      <span class="label">PRE-0627812 (0627812^) — #8 era</span>
      <span class="sub" id="sub-pre-0627812">measuring…</span>
      <div class="sim-window no-native-blur"><div class="host" id="pre-0627812" data-surface="translation"></div></div>
    </div>
  </div>
</div>

<script>
  // Same translated-toast DOM for every version — only the CSS differs.
  const DOM = `
    <main class="translation-stage">
      <div class="translation-bubble compact has-pin no-arrow" role="dialog" aria-label="Translation result">
        <div class="translation-bubble-inner">
          <button class="pin-button" type="button" aria-label="Pin">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
          </button>
          <p class="translation-text">Hello, this is a sample toast,
a preview of the translated text.</p>
          <div class="model-meta-strip">
            <span class="model-meta-main">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v2"/><path d="M12 2v2"/><path d="M17 20v2"/><path d="M17 2v2"/><path d="M2 12h2"/><path d="M2 17h2"/><path d="M2 7h2"/><path d="M20 12h2"/><path d="M20 17h2"/><path d="M20 7h2"/><path d="M7 20v2"/><path d="M7 2v2"/><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
              <span>google/gemini-3.1-flash-image · Cost 0.0000825 cr…</span>
            </span>
          </div>
          <footer class="bubble-footer">
            <label class="language-select-shell" aria-label="Target language">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
              <select class="language-select" aria-label="Target language"><option>English</option></select>
            </label>
            <div class="action-row">
              <label class="model-select-shell" aria-label="Model">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v2"/><path d="M12 2v2"/><path d="M17 20v2"/><path d="M17 2v2"/><path d="M2 12h2"/><path d="M2 17h2"/><path d="M2 7h2"/><path d="M20 12h2"/><path d="M20 17h2"/><path d="M20 7h2"/><path d="M7 20v2"/><path d="M7 2v2"/><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
                <select class="model-select" aria-label="Model"><option>Flash</option></select>
              </label>
              <button class="icon-button" aria-label="Show original">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
              <button class="icon-button" aria-label="Copy">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
              </button>
              <button class="icon-button" aria-label="Close">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
              </button>
            </div>
          </footer>
          <div class="countdown-bar" aria-label="Auto hide"><span class="countdown-bar-fill" style="--countdown-progress: 42%"></span></div>
        </div>
      </div>
    </main>`;

  function measure(subId, root) {
    const card = (root || document).querySelector(".translation-bubble");
    const stage = (root || document).querySelector(".translation-stage");
    if (!card) return;
    const cb = card.getBoundingClientRect();
    const sb = stage.getBoundingClientRect();
    document.getElementById(subId).textContent =
      `card ${Math.round(cb.width)}×${Math.round(cb.height)} · window ${Math.round(sb.width)}×${Math.round(sb.height)}`;
  }

  // CURRENT: plain element, styled by the document's linked src/app.css (live).
  document.getElementById("cur").innerHTML = DOM;
  requestAnimationFrame(() => measure("sub-cur", document));

  // Historical versions: Shadow DOM with a <link> to the :host-scoped stylesheet.
  // Use <link>, NOT fetch(): a file:// page can load a <link> subresource but fetch()
  // of a local file is CORS-blocked (needs a Chrome flag) — which left these two shadow
  // cases empty when the file was just opened in a browser.
  function legacy(id, cssURL) {
    const host = document.getElementById(id);
    const sr = host.attachShadow({ mode: "open" });
    sr.innerHTML = `<link rel="stylesheet" href="${cssURL}" /><style>:host{background:transparent !important}</style>${DOM}`;
    sr.querySelector("link").addEventListener("load", () => measure("sub-" + id, sr));
    return sr;
  }
  legacy("pre-fdcb42c", "./toast-harness-css/pre-fdcb42c.css");
  legacy("pre-0627812", "./toast-harness-css/pre-0627812.css");
</script>
</body>
</html>
