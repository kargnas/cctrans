<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="light" />
<title>CCTrans toast harness</title>
<!-- Links the REAL toast CSS so size/blur/delineation are judged against shipping styles, not a copy. -->
<link rel="stylesheet" href="./src/app.css" />
<style>
  /* ───────────────────────────────────────────────────────────────────────────
     HARNESS-ONLY styles. NEVER ship these. app.css above is the code under test.
     The real toast blur is a native NSVisualEffectView (window .effects() in
     src-tauri/src/lib.rs) which a browser cannot render, so .sim-window fakes it
     with backdrop-filter purely so the translucency/tint/rim LOOK can be judged.
     (The native FLICKER is not reproducible here — that needs the real app.)
     ─────────────────────────────────────────────────────────────────────────── */
  html, body { margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }

  /* Sample desktop behind the toast, echoing image #8: a cream code editor up top
     (high-frequency text-like lines so the blur frosting is visible) over red. The
     cards are centered so they straddle the cream/red seam — exactly like #8, where
     red shows through the translucent lower half as pink. */
  .desktop {
    position: relative;
    min-height: 100vh;
    background: linear-gradient(to bottom, #e9e4d3 0%, #e7e2d0 52%, #d3493b 52%, #c43d2d 100%);
    overflow: hidden;
  }
  .desktop::before {
    content: "";
    position: absolute;
    inset: 0 0 48% 0;
    background:
      repeating-linear-gradient(to bottom, transparent 0 18px, rgba(40,52,74,.16) 18px 21px),
      repeating-linear-gradient(to right, transparent 0 60px, rgba(180,90,40,.10) 60px 96px, transparent 96px 150px, rgba(60,120,80,.10) 150px 210px);
    background-size: 100% 39px, 280px 100%;
  }

  /* padding-top pushes the cards down so they straddle the cream/red seam (52%), like #8. */
  .row { position: relative; display: flex; gap: 56px; align-items: flex-start; padding: 150px 64px 80px; }
  .case { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .case .label {
    font: 12px/1.3 ui-monospace, "SF Mono", monospace;
    color: #fff; background: rgba(0,0,0,.55); padding: 3px 8px; border-radius: 5px;
  }

  /* The native toast WINDOW: rounded 14 (matches .effects().radius), drop shadow,
     and a faux vibrancy blur. .translation-stage (from app.css) fills it. */
  .sim-window {
    width: 396px;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 12px 38px rgba(0,0,0,.24);
    -webkit-backdrop-filter: blur(28px) saturate(1.6);
    backdrop-filter: blur(28px) saturate(1.6);
  }
  /* Real app sizes the window to content height (syncWindowHeight = bubble + 36).
     Let content drive height here instead of the app's 100% fill. */
  .sim-window .translation-stage { height: auto; }
</style>
</head>
<body>
<div class="desktop">
  <div class="row">

    <!-- ───── Translated state = image #8 target ───── -->
    <div class="case">
      <div class="label" id="lbl-translated"></div>
      <div class="sim-window" id="win-translated">
        <main class="translation-stage">
          <div class="translation-bubble compact has-pin" role="dialog" aria-label="Translation result">
            <div class="translation-bubble-inner">
              <button class="pin-button" type="button" aria-label="Pin">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
              </button>
              <p class="translation-text">Hello, this is a sample toast,
a preview of the translated text.</p>
              <div class="model-meta-strip">
                <span class="model-meta-main">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v2"/><path d="M12 2v2"/><path d="M17 20v2"/><path d="M17 2v2"/><path d="M2 12h2"/><path d="M2 17h2"/><path d="M2 7h2"/><path d="M20 12h2"/><path d="M20 17h2"/><path d="M20 7h2"/><path d="M7 20v2"/><path d="M7 2v2"/><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
                  <span>google/gemini-3.1-flash-image · Cost 0.0000825 cr…</span>
                </span>
              </div>
              <footer class="bubble-footer">
                <label class="language-select-shell" aria-label="Target language">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
                  <select class="language-select" aria-label="Target language"><option>English</option></select>
                </label>
                <div class="action-row">
                  <label class="model-select-shell" aria-label="Model">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20v2"/><path d="M12 2v2"/><path d="M17 20v2"/><path d="M17 2v2"/><path d="M2 12h2"/><path d="M2 17h2"/><path d="M2 7h2"/><path d="M20 12h2"/><path d="M20 17h2"/><path d="M20 7h2"/><path d="M7 20v2"/><path d="M7 2v2"/><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
                    <select class="model-select" aria-label="Model"><option>Flash</option></select>
                  </label>
                  <button class="icon-button" aria-label="Show original">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                  <button class="icon-button" aria-label="Copy">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                  </button>
                  <button class="icon-button" aria-label="Close">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                  </button>
                </div>
              </footer>
              <div class="countdown-bar" aria-label="Auto hide">
                <span class="countdown-bar-fill" style="--countdown-progress: 42%"></span>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- ───── Loading state (tall) — size check ───── -->
    <div class="case">
      <div class="label" id="lbl-loading"></div>
      <div class="sim-window" id="win-loading">
        <main class="translation-stage tall">
          <div class="translation-bubble" role="dialog" aria-label="Translation result">
            <div class="translation-bubble-inner">
              <div class="loading-title"><span class="status-dot"></span><span>Translating…</span></div>
              <p class="copying">Translating clipboard…</p>
              <div class="progress-track" aria-hidden="true"><span class="progress-fill"></span></div>
              <footer class="bubble-footer">
                <div class="footer-meta">
                  <span class="language">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
                    <span class="language-text">English</span>
                  </span>
                  <span class="model-label">google/gemini-3.1-flash-image</span>
                </div>
                <div class="action-row">
                  <button class="icon-button" aria-label="Cancel">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                  </button>
                </div>
              </footer>
            </div>
          </div>
        </main>
      </div>
    </div>

  </div>
</div>
<script>
  // Label each window with its rendered pixel size (the "사이즈" check).
  for (const id of ["translated", "loading"]) {
    const w = document.getElementById("win-" + id);
    const l = document.getElementById("lbl-" + id);
    const r = w.getBoundingClientRect();
    l.textContent = id + ": " + Math.round(r.width) + " × " + Math.round(r.height) + " px";
  }
</script>
</body>
</html>
